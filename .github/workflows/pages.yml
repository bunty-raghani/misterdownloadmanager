# Builds misterdownloadmanager.com (tools/website/build.py: website/, docs/, CHANGELOG.md and the
# language list, then every page again in each language of i18n/site/, tools/website/sitei18n.py)
# and publishes it with GitHub Pages, on every push to main that touches them, and
# once a day so the repository's star, fork and issue counts and its contributors (the home page,
# /contributors.html, the News page; tools/contributors.py) on the site stay current.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "Cargo.toml"
      - "i18n/languages.tsv"
      - "i18n/site/**"
      - "tools/website/**"
      - "tools/contributors.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install markdown==3.10
          python tools/website/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
