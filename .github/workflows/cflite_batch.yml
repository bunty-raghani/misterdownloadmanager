# Fuzzing (ClusterFuzzLite, fuzz/), weekly: each target runs for 15 minutes with AddressSanitizer
# on main, growing the corpus that the pull requests' runs start from (kept as an artifact), and
# the corpus is then pruned of the inputs that add no coverage. A crash fails the run, with the
# input that caused it as an artifact.
name: Fuzzing (weekly)

on:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read # the corpus earlier runs left as an artifact
    steps:
      - name: Build the fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run each target
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Shared by the 8 targets: 15 minutes each.
          fuzz-seconds: 7200
          mode: batch
          sanitizer: address

  prune:
    needs: batch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Build the fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prune the corpus
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: prune
