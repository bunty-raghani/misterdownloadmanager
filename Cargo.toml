[workspace]
resolver = "3"
members = ["crates/*"]
# The fuzz targets are a workspace of their own (nightly, libFuzzer): see fuzz/Cargo.toml.
exclude = ["fuzz"]

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
authors = ["Ahmed Nefzaoui"]
publish = false

[workspace.dependencies]
mdm-cli = { path = "crates/cli" }
mdm-cnl = { path = "crates/cnl" }
mdm-crash = { path = "crates/crash", default-features = false }
mdm-debrid = { path = "crates/debrid" }
# Without its browser-like connection unless asked (the app asks: its `browser-connection`).
mdm-engine = { path = "crates/engine", default-features = false }
mdm-extract = { path = "crates/extract" }
mdm-geo = { path = "crates/geo" }
mdm-ipc = { path = "crates/ipc" }
mdm-labserver = { path = "crates/labserver" }
mdm-mcp = { path = "crates/mcp" }
mdm-remote = { path = "crates/remote" }
mdm-tools = { path = "crates/tools" }
mdm-torrent = { path = "crates/torrent" }

# storytold craft-libs (D-003), pinned by commit.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "1a11a4897865f7410c40d25ca6e452ce399a1a2c" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "1a11a4897865f7410c40d25ca6e452ce399a1a2c" }

# UI: egui 0.37 on storytold's egui/winit forks, the same commits craft-libs uses (see [patch]).
# "clipboard": text boxes cut, copy and paste with the system clipboard (without it egui keeps
# a clipboard of its own, and Ctrl+V / Cmd+V never sees what other programs copied).
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard"] }
egui = "0.37.0"
# The lock that keeps MDM's own clipboard reads and writes apart from egui's (main.rs, #629).
egui-winit = { version = "0.37.0", default-features = false }
egui_extras = { version = "0.37.0", features = ["svg", "image"] }
# The font parser egui reads fonts with, the same version: a system font is checked with it
# before egui is given it, since egui stops on a configured font it can't read (theme.rs, #931).
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
# A font from the system for a script MDM's own font lists don't name (theme.rs, #1125): the
# system's own choice (DirectWrite, CoreText) through fontique, in the same egui fork; the font
# files are mapped, not read into memory.
egui_system_font_provider = { git = "https://github.com/anefzaoui/egui.git", rev = "82ba93539645f29f39835a5691b5d4b79433b88e" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
dirs = "7.0.0"
# Gzipped IP blocklists, read to convert them for librqbit (crates/torrent blocklist.rs).
flate2 = "1.1.10"
arboard ={ version = "3.7.0", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
open = "5.4.5"

anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
http-range-header = "0.4.2"
httpdate = "1.0.3"
# Checksum verification (crates/engine/src/verify.rs).
md-5 = "0.11.0"
sha1 = "0.11.0"
crc32fast = "1.5.3"
# Free space and file system per volume (disk preflight); only the disk part.
sysinfo = { version = "0.40.0", default-features = false, features = ["disk"] }
proptest = "1.12.0"
# HTTP/1.1 only: each engine worker must be one real TCP connection (notes/ENGINE.md §4).
# The browser-like connection (#668, crates/engine/src/browserlike.rs): a download whose site's
# bot check refused MDM's own connection is asked once more the way a browser connects (its TLS
# handshake, HTTP/2 settings and header order), on BoringSSL. Builds BoringSSL from source:
# CMake, a C/C++ compiler, libclang and, on Windows, NASM.
wreq = { version = "=0.16.3", default-features = false, features = ["webpki-roots", "tokio-rt", "socks", "stream", "gzip", "brotli", "zstd", "deflate"] }
# emulation-compression: the profile's own Accept-Encoding, in Chrome's place and words (#1494).
wreq-util = { version = "=0.2.1", default-features = false, features = ["emulation", "emulation-compression"] }
# Its trusted certificates: Mozilla's (as wreq's own default) and the system's, which MDM's own
# connection trusts too (an antivirus's or a company's HTTPS inspection adds its own there).
rustls-native-certs = "0.8.5"
webpki-root-certs = "1.0.11"
webpki-roots = "1.0.12"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "system-proxy", "socks"] }
# FTP and FTPS (crates/engine/src/ftp.rs), with TLS through the rustls and platform verifier
# reqwest uses. "deprecated" is what enables implicit FTPS (ftps://, port 990).
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio-rustls-aws-lc-rs", "deprecated"] }
# FTP through a SOCKS proxy (#1558); already in the tree through librqbit and wreq.
tokio-socks = "0.5.3"
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
# Custom DNS (#36): plain DNS, DNS over TLS and over HTTPS, with aws-lc-rs (no ring) and the
# platform's certificate checks, the same as downloads. Not its system config: "the system's DNS"
# stays tokio's own lookup.
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "tls-aws-lc-rs", "https-aws-lc-rs", "rustls-platform-verifier"] }
# Network adapter binding (#35, crates/engine/src/net.rs): sockets held to a device (Linux) or
# an interface index (macOS) need socket2's "all"; the adapter list; the system proxy resolved
# before a bound client is built. All three are already in the tree (tokio, hyper, librqbit).
socket2 = { version = "0.6.5", features = ["all"] }
network-interface = "2.0.5"
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy-system"] }
# The release signatures' RSA and Ed25519 checks (crates/tools/src/openpgp.rs): the crypto
# library rustls brings anyway, with the same features.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
# The MCP server (crates/mcp): the official Rust SDK, stdio only.
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
# The lab FTP server's test certificates.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
# Their dates (rcgen's own).
time = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.2", default-features = false, features = ["std", "parse", "serde"] }
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
percent-encoding = "2.3.2"
url = { version = "2.5.8", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
# Denied everywhere; only crates/app/src/win32.rs (Windows FFI) opts in (D-008).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Whole-program optimisation in one unit: smaller and a little faster programs, for a slower
# release build (#25).
lto = "fat"
codegen-units = 1
# Function names and file:line for crash reports. The debug info doesn't ship: CI turns it into the
# release's symbols zip (tools/installer/symbols.py); Windows keeps it in the .pdb, which no
# download includes, and Linux and macOS strip it from the programs they ship.
debug = "line-tables-only"
# The whole program optimised for size (#158): with fat LTO it is optimised as one unit, at the
# program's own level, so this is what decides. It took 9 MB (21 %) off the app's program and
# 2.4 MB off the installer, for no measurable cost in a download's speed or CPU (a 2 GiB file and
# its SHA-256 from the lab server, 10 runs each: 5.2 s CPU before, 5.4 s after, within the
# runs' spread; the time is the disk's). "s" keeps loops vectorised ("z" doesn't).
opt-level = "s"

# Hashing is unusably slow unoptimised (a 3 MiB SHA-256 took seconds in debug tests): build
# the checksum crates optimised in dev too.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
# The app's build script packs the translation catalogs with brotli at its best (crates/app/
# build.rs): unoptimised, that takes minutes instead of seconds. Build scripts are unoptimised
# in release builds too.
[profile.dev.package.brotli]
opt-level = 3
[profile.release.package.brotli]
opt-level = 3
# Unpacking them at each start (crates/app/src/i18n.rs), in debug builds too.
[profile.dev.package.brotli-decompressor]
opt-level = 3

# Dependencies' debug info: file:line only, so backtraces still name them, in debug symbols a
# fraction of the size (every test program links them all). MDM's own crates keep full debug
# info, for stepping through them in a debugger.
[profile.dev.package."*"]
debug = "line-tables-only"

# The crash monitor's stack walker (rust-minidump's, through framehop) works out a frozen
# thread's frames from the registers the dump caught, which can be anything mid-instruction: it
# adds to them as a release build does, wrapping, and a frame that leads nowhere ends the walk.
# Debug builds check that arithmetic and panicked instead ("attempt to add with overflow" in
# pe-unwind-info), so a freeze test's report was never written (the busy minimized window's,
# #1481). Release builds never checked it.
[profile.dev.package.pe-unwind-info]
overflow-checks = false
[profile.dev.package.framehop]
overflow-checks = false

# storytold's egui fork (as storytold/craft-libs, D-003) plus MDM's commits on anefzaoui/egui
# (branch mdm-start-hidden, on mdm-wgpu, on mdm-accesskit-windows): every window created hidden
# gets an AccessKit adapter, with OpenGL (glow) and with Direct3D (wgpu, #89), so screen readers
# read the dialogs and menus; a dialog opened while the main window is minimized no longer panics
# (emilk/egui#8470); and a window's first accessibility request is answered with its last tree
# (#131); Direct3D keeps only the graphics adapter in use (a laptop's other GPU sleeps) and, on
# Intel Iris Xe, uploads no all-zero texel blocks (gfx-rs/wgpu#10651, #89); a hidden viewport
# can ask for a pass (Context::request_ui_pass: a dialog opened while minimized, #162); OpenGL
# without a usable configuration is an error, not a panic, so the next renderer is tried; a main
# window built hidden stays hidden after its first frame (a start with the session waits in the
# notification area, #226); a monitor that has just gone away has no size instead of a panic (#335); the clipboard used
# by one thread at a time, egui's copy and paste and MDM's own reads (`egui_winit::clipboard::
# lock_system_clipboard`, #629); a dialog that changes its size is drawn at the window's new size
# (its size applied before the pass, the Direct3D surface matched to the window before painting,
# #471, by aniyow07); an OpenGL window's swap interval is chosen per window, before each swap
# (`ViewportHooks::swap_waits_for_vsync`, branch mdm-swap-interval: Linux, renderer.rs, #347);
# an OpenGL window's context is made current again when it is no longer the thread's own (macOS),
# and a texture OpenGL can't create is kept for a later frame instead of a panic (branch
# mdm/glow-texture-no-panic, #1173); a window OpenGL can't paint for a moment (its context can't
# be made current on it, a frame that can't be shown) is painted again 100 ms later instead of a
# panic, the context kept, and the app is told (`ViewportHooks::gl_paint_failed`, branch
# mdm-gl-context-errors, #1448); every window's texture changes wait in one queue and reach the
# painter whichever window paints first, so a dialog draws the pictures the main window loaded
# while it was minimized (branch mdm-shared-texture-deltas, #1639).
# craft-libs can take the same commits to share one egui again.
[patch.crates-io]
# librqbit 9.1.0 with per-torrent rate limits that change while a torrent runs (#39), and a
# magnet lookup's progress counted (#92), and every socket bound to one address (`bind_ip`,
# #143), and every HTTP client of a session built through MDM's TLS setup (`configure_http_client`:
# a system without CA certificates), and a DHT that stops asking a bootstrap node that never
# answers once another one has, and loads its saved IPv6 nodes (#650), and a piece whose hash
# check a pause cuts short queued again instead of lost (#706), and the peers that others name
# asked of MDM before they are used (`peer_filter`), until upstream has them
# (ikatson/rqbit); every crate of that repository from the same commit.
librqbit = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-bencode = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-buffers = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-clone-to-owned = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-core = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-dht = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-lsd = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-peer-protocol = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-sha1-wrapper = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-tracker-comms = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-upnp = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
# librqbit's uTP (#1384) as merged upstream after 0.7.0, until a release has it
# (ikatson/librqbit-utp#3, #4): on Windows, one packet sent to a closed port (or one oversized
# datagram) no longer stops uTP for the whole session, and ringbuf 0.5.
librqbit-utp = { git = "https://github.com/ikatson/librqbit-utp.git", rev = "06e1c53c8df6edb2830d6aab64a6d4bed8479908" }
ecolor = { git = "https://github.com/anefzaoui/egui.git", rev = "82ba93539645f29f39835a5691b5d4b79433b88e" }
emath = { git = "https://github.com/anefzaoui/egui.git", rev = "82ba93539645f29f39835a5691b5d4b79433b88e" }
epaint = { git = "https://github.com/anefzaoui/egui.git", rev = "82ba93539645f29f39835a5691b5d4b79433b88e" }
epaint_default_fonts = { git = "https://github.com/anefzaoui/egui.git", rev = "82ba93539645f29f39835a5691b5d4b79433b88e" }
egui = { git = "https://github.com/anefzaoui/egui.git", rev = "82ba93539645f29f39835a5691b5d4b79433b88e" }
egui-winit = { git = "https://github.com/anefzaoui/egui.git", rev = "82ba93539645f29f39835a5691b5d4b79433b88e" }
egui_glow = { git = "https://github.com/anefzaoui/egui.git", rev = "82ba93539645f29f39835a5691b5d4b79433b88e" }
egui-wgpu = { git = "https://github.com/anefzaoui/egui.git", rev = "82ba93539645f29f39835a5691b5d4b79433b88e" }
egui_extras = { git = "https://github.com/anefzaoui/egui.git", rev = "82ba93539645f29f39835a5691b5d4b79433b88e" }
eframe = { git = "https://github.com/anefzaoui/egui.git", rev = "82ba93539645f29f39835a5691b5d4b79433b88e" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
# wgpu-hal 30.0.1 (the v30.0.1 release commit) with one change: a window's Direct3D 12 swap chain
# is made with DXGI_SCALING_NONE instead of STRETCH, so while a dialog resizes, Windows shows the
# last frame unscaled until one of the new size comes, instead of stretching it (#471, by
# aniyow07; branch mdm-dxgi-scaling-none). Every crate of that repository MDM uses comes from
# the same commit, so there is one copy of each (wgpu-hal's own dependencies are paths in it).
# Drop them when wgpu offers the scaling mode on SurfaceConfiguration (gfx-rs/wgpu#10196) and
# MDM asks for it there; moving to a wgpu other than 30.0.1 needs the change on that release.
naga = { git = "https://github.com/anefzaoui/wgpu.git", rev = "1c6f336e239ff7bc46b4dec194f1d96d3d4f8e04" }
naga-types = { git = "https://github.com/anefzaoui/wgpu.git", rev = "1c6f336e239ff7bc46b4dec194f1d96d3d4f8e04" }
wgpu = { git = "https://github.com/anefzaoui/wgpu.git", rev = "1c6f336e239ff7bc46b4dec194f1d96d3d4f8e04" }
wgpu-core = { git = "https://github.com/anefzaoui/wgpu.git", rev = "1c6f336e239ff7bc46b4dec194f1d96d3d4f8e04" }
wgpu-core-deps-apple = { git = "https://github.com/anefzaoui/wgpu.git", rev = "1c6f336e239ff7bc46b4dec194f1d96d3d4f8e04" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/anefzaoui/wgpu.git", rev = "1c6f336e239ff7bc46b4dec194f1d96d3d4f8e04" }
wgpu-hal = { git = "https://github.com/anefzaoui/wgpu.git", rev = "1c6f336e239ff7bc46b4dec194f1d96d3d4f8e04" }
wgpu-naga-bridge = { git = "https://github.com/anefzaoui/wgpu.git", rev = "1c6f336e239ff7bc46b4dec194f1d96d3d4f8e04" }
wgpu-types = { git = "https://github.com/anefzaoui/wgpu.git", rev = "1c6f336e239ff7bc46b4dec194f1d96d3d4f8e04" }
