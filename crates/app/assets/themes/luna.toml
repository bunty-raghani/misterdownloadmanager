"progress.connections" = "#282530"
"meter.track" = "#161b26"
"meter.edge" = "#4a5a7c"
"focus.ring" = "#ffffff"
menu = "#1c2230"
"menu.item" = "#1c2230"
"menu.hot" = "#2d4170"
"menu.border" = "#3c4558"
menubar = "#1f2533"
"menubar.bottom" = "#1f2533"
"menubar.hot" = "#2d4170"
"menubar.open" = "#2d4170"
"menubar.line" = "#121620"
"toolbar.hot" = "#2d4170"
"toolbar.hot.faint" = "#232f48"
"toolbar.hot.edge" = "#4d7fe0"
"toolbar.hot.border" = "#4d7fe0"
"toolbar.pressed" = "#25365e"
