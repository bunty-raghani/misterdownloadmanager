# Luna: one of Mister Download Manager's built-in themes, after Windows XP's look (2001): the
# feel of its colours and shapes, drawn by MDM (no picture, font or icon of Microsoft's), with an
# icon set drawn for MDM in that manner.
# It is also an example of a theme file: seeds for the colours, the roles XP sets apart by hand,
# XP's controls (shaded buttons with a glow under the pointer, green ticks, progress in blocks,
# scroll bars on pale blue buttons, column headers shaded along their bottom, Tahoma menus),
# a deep blue title bar on Windows and an icon set. XP had no dark mode: the dark side is the
# same look at night.

name = "Luna"
icon-set = "luna"
icons = "color"

[controls]
field-focus = "border"
check = "luna"
button = "luna"
progress = "blocks"
scroll = "luna"
focus = "dotted"
caption = "luna"
header = "luna"
ui-font = "tahoma"

[sizes]
# Square text boxes and menus; buttons and progress bars rounded a little.
radius = 0
"radius.button" = 3
"radius.part" = 0
"radius.check" = 0
"radius.flyout" = 0
"radius.menu-item" = 0
"radius.popup" = 0
"radius.egui" = 0
# Tahoma 8 points, XP's menu font; the title bar's bold a little larger.
"font.ui" = 11
"font.ui.bold" = 12

[seeds.light]
background = "#ece9d8"
surface = "#ffffff"
header = "#ffffff"
text = "#000000"
accent = "#316ac5"
selection = "#316ac5"
error = "#c42b1c"
warning = "#9d5d00"
success = "#1d7c1d"

[seeds.dark]
background = "#1f2533"
surface = "#161b26"
header = "#161b26"
text = "#ffffff"
accent = "#6d9cf0"
selection = "#2f5fb8"
error = "#ff8f80"
warning = "#f7c35c"
success = "#6fd36f"

[light]
# XP's buttons: shaded from white at the top, a dark blue edge, an orange glow inside under the
# pointer and a blue one on the default button; pressed, the face a shade deeper.
gloss = "#ffffff"
button = "#d6d0c5"
"button.hot" = "#d6d0c5"
"button.pressed" = "#c4bdaf"
"button.border" = "#003c74"
"button.bottom" = "#003c74"
"button.default.border" = "#7fa2ee"
"button.default.bottom" = "#003c74"
"button.glow" = "#f6b73c"
"button.text" = "#000000"
"button.text.pressed" = "#000000"
"button.disabled" = "#f4f3ee"
"button.disabled.border" = "#c9c7ba"
# Text boxes: XP's blue-grey edge, square; the accent's when focused.
"field.border" = "#7f9db9"
"field.bottom" = "#7f9db9"
# Check boxes and radios: a dark blue edge, a white inside shaded from the top, a green tick.
check = "#ffffff"
"check.hot" = "#ffffff"
"check.pressed" = "#dedbcf"
"check.border" = "#1c5180"
"check.border.hot" = "#1c5180"
"check.border.pressed" = "#1c5180"
"check.border.disabled" = "#cac8bb"
"check.on" = "#21a121"
"check.on.hot" = "#21a121"
"check.on.pressed" = "#1a8a1a"
"check.on.disabled" = "#cac8bb"
"check.mark" = "#21a121"
# Progress in green blocks, the progress window's bar too.
"progress.bar" = "#2ed33a"
"meter.fill" = "#2ed33a"
"meter.track" = "#ffffff"
"meter.edge" = "#686868"
# The progress window's connections: a blue bar, white where nothing has come yet, a magenta line
# where each connection starts; the table under it on a greyish mauve.
"segments.done" = "#0000ff"
"segments.missing" = "#ffffff"
"segments.start" = "#c000c0"
"progress.connections" = "#beb4bd"
# The keyboard focus: Windows' dotted rectangle, black.
"focus.ring" = "#000000"
# Menus: a light blue item under the pointer.
menu = "#ffffff"
"menu.item" = "#ffffff"
"menu.hot" = "#c1d2ee"
"menu.border" = "#8a867a"
menubar = "#ece9d8"
"menubar.bottom" = "#ece9d8"
"menubar.hot" = "#c1d2ee"
"menubar.open" = "#c1d2ee"
"menubar.line" = "#ffffff"
# The etched line between the menu bar and the toolbar: white, grey, white.
"toolbar.line" = "#aca899"
"toolbar.line.light" = "#ffffff"
# Toolbar buttons: light blue with a blue edge under the pointer.
"toolbar.hot" = "#c1d2ee"
"toolbar.hot.faint" = "#dfe8f6"
"toolbar.hot.edge" = "#316ac5"
"toolbar.hot.border" = "#316ac5"
"toolbar.pressed" = "#98b5e2"
# Scroll bars: the arrows and the thumb on pale blue buttons with a light inner edge, dark blue
# arrows and grip, on a near-white track.
"scroll.track" = "#fcfcf8"
"scroll.corner" = "#ece9d8"
"scroll.thumb" = "#c1d3fb"
"scroll.thumb.hot" = "#d6e3fe"
"scroll.thumb.pressed" = "#a6bef2"
"scroll.edge" = "#a4b6dc"
"scroll.glyph" = "#4d6185"
# Column headers: XP's beige, its three bottom rows shading to the dividers' colour.
header = "#ebeadb"
"header.sep" = "#cbc7b8"
"header.line" = "#d6d2c2"
"header.sorted" = "#e2e0d0"
# Lists' and tables' frames: XP's grey.
"list.frame" = "#96978f"
# The title bar: XP's deep blue (#0054e3), with a light band under its top edge, lighter and
# more vivid again toward its dark bottom edge (the "luna" caption style shades it from this
# colour, as XP's own rows); a paler blue while the window isn't the active one. Its buttons a
# lighter blue, Close red-orange, with a white edge (the gloss) and glyph. While the window isn't the active one, XP
# shows the buttons half-faded into the paler bar: a mid blue, Close a dusty rose, their edge
# a pale blue, and the glyphs still solid white. The glyphs are XP's shapes (Minimize a short
# thick bar low in the button), drawn by the "luna" caption style.
caption = "#0054e3"
"caption.inactive" = "#7a96df"
"caption.text" = "#ffffff"
"caption.text.inactive" = "#d8e4f8"
"caption.button" = "#2a5ff0"
"caption.close" = "#e0441c"
"caption.close.text" = "#ffffff"
"caption.button.inactive" = "#5478e8"
"caption.close.inactive" = "#ad7690"
"caption.glyph.inactive" = "#ffffff"
"caption.edge.inactive" = "#bdc9ef"

