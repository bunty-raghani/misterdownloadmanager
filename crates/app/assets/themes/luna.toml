button = "#3a4560"
"button.hot" = "#3a4560"
"button.pressed" = "#2c3550"
"button.border" = "#6a80b4"
"button.bottom" = "#6a80b4"
"button.default.border" = "#4d7fe0"
"button.default.bottom" = "#6a80b4"
"button.glow" = "#e0a13a"
"button.text" = "#ffffff"
"button.text.pressed" = "#ffffff"
"button.disabled" = "#2a3142"
"button.disabled.border" = "#3c4558"
"field.border" = "#4a5a7c"
"field.bottom" = "#4a5a7c"
check = "#161b26"
"check.hot" = "#1e2535"
"check.pressed" = "#262f44"
"check.border" = "#7b93c8"
"check.border.hot" = "#7b93c8"
"check.border.pressed" = "#7b93c8"
"check.border.disabled" = "#3c4558"
"check.on" = "#4fc24f"
"check.on.hot" = "#4fc24f"
"check.on.pressed" = "#3fa83f"
"check.on.disabled" = "#4a5266"
"check.mark" = "#4fc24f"
"progress.bar" = "#2fae2f"
