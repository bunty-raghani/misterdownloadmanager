<!doctype html>
<!-- Douyin's recommended feed, reduced to what names a video (our own sample: no real account or
     video). Each slide carries its post's id (data-e2e-vid, the aweme id), read as yt-dlp's
     /video/<id>; the active one and the next one the player has ready below it (#1092). -->
<html><head><meta charset="utf-8"><meta name="mdm-page" content="https://www.douyin.com/?recommend=1"><title>抖音-记录美好生活</title><link rel="stylesheet" href="feeds.css"></head>
<body>
<main id="douyin-right-container"><div id="slidelist"><div data-e2e="slideList">
  <div data-e2e="feed-item">
    <div id="sliderVideo" data-e2e="feed-active-video" data-e2e-vid="7690000000000000001">
      <div><div data-xgplayerid="sample-1"><xg-video-container><video data-expect="https://www.douyin.com/video/7690000000000000001"></video></xg-video-container></div></div>
      <div class="info"><span>sample creator a</span></div>
    </div>
  </div>
  <div data-e2e="feed-item">
    <div id="sliderVideo" data-e2e="feed-video" data-e2e-vid="7690000000000000002">
      <div><div data-xgplayerid="sample-2"><xg-video-container><video data-expect="https://www.douyin.com/video/7690000000000000002"></video></xg-video-container></div></div>
    </div>
  </div>
  <div data-e2e="feed-item">
    <div data-e2e="feed-live">
      <div><xg-video-container><video data-expect="none"></video></xg-video-container></div>
    </div>
  </div>
</div></div></main>
</body></html>
